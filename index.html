function vWelcome(){const ps=Object.values(DB.profiles);return `<div class="narrow"><div class="card c"><div class="logo" aria-hidden="true">🎲</div><h1>${L('SELAMAT DATANG DI DICE BINGO!','WELCOME TO DICE BINGO!')}</h1><p class="mu"><em>${L('Lempar dadu, belajar Inggris, dapatkan Bingo!','Roll the Dice, Learn English, and Get Bingo!')}</em></p>
<div>${langBtns()}</div>
<label for="f1">${L('Nama','Student Name')}</label><input id="f1" autocomplete="off">
<label for="f2">${L('Kelas','Class')}</label><select id="f2">${[4,5,6,7,8,9,10,11,12].map(x=>`<option>${x}</option>`).join('')}<option>${L('Lainnya','Other')}</option></select>
<label for="f3">${L('Nomor Presensi','Attendance Number')}</label><input id="f3" autocomplete="off">
<label for="f4">${L('Asal Madrasah/Sekolah','Madrasah or School Name')}</label><input id="f4" autocomplete="off">
<p id="er" class="er" role="alert"></p><button class="btn pr" onclick="login()">${L('Lanjutkan','Continue')}</button>
${ps.length?`<h3>${L('Profil tersimpan','Saved profiles')}</h3>${ps.map(p=>`<button class="btn" onclick="sw('${p.id}')">${esc(p.name)} (${esc(p.cls)})</button>`).join('')}`:''}
<p class="mu sm">Created by Ahmad Budi Leksono</p></div></div>`}
const langBtns=()=>`<button class="btn ${lang==='id'?'pr':''}" onclick="setLang('id')">Bahasa Indonesia</button><button class="btn ${lang==='en'?'pr':''}" onclick="setLang('en')">English</button>`;
function shell(h){return `<div class="top"><button class="btn" aria-label="Menu" onclick="menu=!menu;render()">☰</button><b>🎲 Dice Bingo</b></div><div class="shell"><nav class="side ${menu?'open':''}" aria-label="Menu"><h3>🎲 DICE BINGO</h3><p class="mu sm">${esc(cur.name)} · ${esc(cur.cls)}</p>${MENU.map(m=>`<button class="${act===m[0]?'act':''}" onclick="nav('${m[0]}')">${m[1]} ${lang==='id'?m[2]:(m[3]||m[2])}</button>`).join('')}<p class="mu sm">Created by Ahmad Budi Leksono</p></nav><main class="main">${h}</main></div>`}
function vDash(){const s=cur.st,acc=s.a?Math.round(100*s.c/s.a):0,bd=BG.filter(b=>b[2](s)).length;let reco=L('Mulai permainan pertamamu untuk melihat kemajuan.','Start your first game to see your progress.');
if(s.g){const ms=Object.entries(s.md).filter(([k,m])=>m.a>=3).sort((a,b)=>a[1].c/a[1].a-b[1].c/b[1].a);reco=ms.length?L('Perbanyak latihan: ','Practice more: ')+MN[ms[0][0]]+' Bingo':L('Teruslah bermain untuk mendapat rekomendasi.','Keep playing to get recommendations.')}
return `<h1>${L('Selamat datang, ','Welcome, ')}${esc(cur.name)}! ${L('Siap bermain Dice Bingo?','Ready to play Dice Bingo?')}</h1><p class="mu">${L('Kelas','Class')} ${esc(cur.cls)} · No. ${esc(cur.no)} · ${esc(cur.school)}</p>
<div class="sts">${card(L('Permainan','Games'),s.g)}${card(L('Soal dijawab','Answered'),s.a)}${card(L('Benar','Correct'),s.c)}${card(L('Akurasi','Accuracy'),acc+'%')}${card(L('Skor total','Total score'),s.sc)}${card('Bingo',s.b)}${card('Badge',bd+'/'+BG.length)}</div>
<div class="card"><h3>💡 ${L('Rekomendasi','Recommendation')}</h3><p>${reco}</p><button class="btn pr" onclick="nav('play')">🎲 ${L('Mulai Permainan','Start Game')}</button></div>
<div class="card"><h3>${L('Progres Level','Level Progress')}</h3>${LV.map((n,i)=>{const x=s.lv[i]||{g:0,b:0};return `<p><b>${n}</b> — ${x.g} ${L('permainan','games')}, ${x.b} Bingo, ${pool(i,'mix').length} ${L('soal tersedia','questions available')}</p><div class="bar"><i style="width:${Math.min(100,x.b*20)}%"></i></div>`}).join('')}</div>
<div class="card"><h3>${L('Riwayat Terakhir','Recent Games')}</h3>${cur.jr.length?cur.jr.slice(0,5).map(j=>`<p>${esc(j.d)} · ${LV[j.l]} · ${j.k}/${j.a} · ${L('skor','score')} ${j.sc}${j.b?' · Bingo!':''}</p>`).join(''):`<p class="mu">${L('Belum ada riwayat.','No history yet.')}</p>`}</div>`}
function vProf(){return `<h2>${L('Profil Murid','Student Profile')}</h2><div class="card"><label for="e1">${L('Nama','Student Name')}</label><input id="e1" value="${esc(cur.name)}"><label for="e2">${L('Kelas','Class')}</label><select id="e2">${[4,5,6,7,8,9,10,11,12,L('Lainnya','Other')].map(x=>`<option ${String(x)===cur.cls?'selected':''}>${x}</option>`).join('')}</select><label for="e3">${L('Nomor Presensi','Attendance Number')}</label><input id="e3" value="${esc(cur.no)}"><label for="e4">${L('Asal Madrasah/Sekolah','Madrasah or School Name')}</label><input id="e4" value="${esc(cur.school)}"><p id="er" class="er" role="alert"></p><button class="btn pr" onclick="saveProf()">${L('Simpan','Save')}</button><button class="btn" onclick="logout()">${L('Sesi baru / ganti profil','New session / switch profile')}</button></div><p class="mu sm">${L('Progres setiap profil disimpan terpisah di perangkat ini.','Each profile’s progress is stored separately on this device.')}</p>`}
function vSetup(){const n=pool(gc.level,gc.content).length,o=(v,t,c)=>`<option value="${v}" ${c==v?'selected':''}>${t}</option>`;
return `<h2>🎲 ${L('Atur Permainan','Game Setup')}</h2><div class="card grid2"><div><label>Level</label><select onchange="setGC('level',+this.value)">${LV.map((x,i)=>o(i,x,gc.level)).join('')}</select></div>
<div><label>${L('Materi','Content')}</label><select onchange="setGC('content',this.value)">${o('mix',L('Campuran','Mixed'),gc.content)}${Object.entries(MN).map(([k,v])=>o(k,v,gc.content)).join('')}</select></div>
<div><label>${L('Format','Format')}</label><select onchange="setGC('fmt',this.value)">${Object.entries(FM).map(([k,v])=>o(k,v,gc.fmt)).join('')}</select></div>
<div><label>${L('Ukuran papan','Board size')}</label><select onchange="setGC('size',+this.value)">${[3,4,5].map(x=>o(x,x+'×'+x,gc.size)).join('')}</select></div>
${gc.size===5?`<div><label><input type="checkbox" ${gc.free?'checked':''} onchange="setGC('free',this.checked)"> FREE SPACE</label></div>`:''}
${gc.fmt==='two'?`<div><label>${L('Pemain 1','Player 1')}</label><input value="${esc(gc.p1)}" oninput="gc.p1=this.value"></div><div><label>${L('Pemain 2','Player 2')}</label><input value="${esc(gc.p2)}" oninput="gc.p2=this.value"></div>`:''}</div>
<div class="card"><h3>${L('Aturan & skor','Rules & scoring')}</h3><ul><li>${L('Dadu d (1–6) membuka petak bernomor d, d+6, d+12… Jika semuanya sudah terisi, petak kosong mana pun boleh dipilih.','Dice d (1–6) unlocks squares numbered d, d+6, d+12… If all are taken, any empty square can be chosen.')}</li>
<li>${L('Jawaban benar: +10 (+5 jika memakai petunjuk) dan petak ditandai. Salah: 0 dan petak tetap tersedia.','Correct: +10 (+5 with a hint) and the square is marked. Wrong: 0 and the square stays open.')}</li>
<li>${L('Garis Bingo (baris/kolom/diagonal): +25 per garis. Menyelesaikan sesi: +10.','Bingo line (row/column/diagonal): +25 per line. Finishing a session: +10.')}</li>
<li>${L('Batas soal: ','Question limit: ')}${gc.size*gc.size}${gc.fmt==='quick'?L(' atau waktu '+DB.cfg.time+' detik habis.',' or the '+DB.cfg.time+'s timer ends.'):'.'}${gc.fmt==='free'?L(' Latihan bebas tidak memberi skor.',' Free Practice gives no score.'):''}${gc.fmt==='two'?L(' Pemain bergantian; menang dengan Bingo, atau skor tertinggi jika tidak ada Bingo.',' Players alternate; win by Bingo, or the higher score if there is no Bingo.'):''}</li></ul>
<p>${L('Soal tersedia','Questions available')}: <b>${n}</b> ${n?'':'— '+L('tidak tersedia di peramban ini.','not available in this browser.')}</p><button class="btn pr" ${n?'':'disabled'} onclick="startGame()">${L('Mulai Permainan','Start Game')}</button></div>`}
function vGame(){const n=G.size,p=G.turn,q=G.q;
const cells=G.own.map((o,i)=>{const hl=G.sel.includes(i)&&!G.q&&!G.over;return `<button class="cell ${o>=0?'m'+o:''} ${o===-1?'fr':''} ${hl?'hl':''} ${G.win&&G.win.includes(i)?'win':''}" ${hl?'':'tabindex="-1"'} aria-label="${L('Petak','Square')} ${i+1}${o>=0?' '+L('ditandai','marked'):''}" onclick="cell(${i})">${o===-1?'FREE':o===0?'✓ '+(i+1):o===1?'★ '+(i+1):i+1}</button>`}).join('');
let res='';if(G.over){const w=G.winner;res=`<div class="card"><h2>${G.kind==='bingo'?'BINGO! YOU DID IT!':L('Permainan Selesai','Game Over')}</h2><p>${G.kind==='bingo'?(G.fmt==='two'?esc(G.names[w])+' '+L('menang!','wins!')+' ':'')+L('Selamat! Kamu melengkapi satu garis dan menjawab tantangan belajar dengan benar.','Congratulations! You completed a winning line and answered the learning challenges correctly.'):(G.fmt==='two'?(w<0?L('Seri.','Draw.'):esc(G.names[w])+' '+L('menang berdasarkan skor.','wins on score.')):L('Belum ada garis Bingo kali ini. Petak ditandai: ','No Bingo line this time. Squares marked: ')+(G.kind==='bingo'?'':G.own.filter(o=>o>=0).length))}</p>
<p>${G.names.map((nm,i)=>`${esc(nm)}: ${L('skor','score')} <b>${G.sc[i]}</b>, ✔ ${G.cor[i]}, ✘ ${G.wro[i]}`).join('<br>')}</p><button class="btn pr" onclick="startGame()">${L('Ulangi Permainan','Play Again')}</button><button class="btn" onclick="nav('dash')">${L('Dasbor','Dashboard')}</button></div>`}
let qp='';if(q){const f=q.fb;qp=`<div class="card" aria-live="polite">${q.pic?`<div class="pic" role="img" aria-label="${L('Gambar soal','Question picture')}">${q.pic}</div>`:''}<h3>${esc(q.q)}</h3>${q.say?`<button class="btn" onclick="speak('${q.say}')">🔊 ${L('Putar audio','Play audio')}</button>`:''}
${q.o.map((o,k)=>`<button class="opt ${f?(o===q.a?'ok':k===q.pick?'bad':''):k===q.pick?'sel':''}" ${f?'disabled':''} onclick="pick(${k})">${'ABCD'[k]}. ${esc(o)}${f&&o===q.a?' ✓':f&&k===q.pick?' ✗':''}</button>`).join('')}
${f?`<p><b>${f.ok?L('Benar!','Correct!')+(G.fmt==='free'?'':' +'+f.pts+' '+L('poin','points')):L('Belum tepat. Jawaban: ','Not quite. Answer: ')+esc(q.a)}</b><br>${esc(q.e)}</p><button class="btn pr" onclick="next()">${L('Lanjut','Next')}</button>`
:`${q.hint?`<p class="mu">💡 ${L('Diawali huruf','Starts with')} “${esc(q.a[0])}” (${q.a.length} ${L('huruf','letters')})</p>`:(DB.cfg.hint?`<button class="btn" onclick="G.q.hint=true;render()">💡 ${L('Petunjuk','Hint')}</button>`:'')}<button class="btn pr" ${q.pick==null?'disabled':''} onclick="check()">${L('Periksa Jawaban','Check Answer')}</button>`}</div>`}
const dm=G.d?`${L('Dadu','Dice')} ${G.d}: ${L('petak','squares')} ${G.sel.map(i=>i+1).join(', ')}`:L('Lempar dadu, lalu pilih petak yang menyala.','Roll the dice, then pick a highlighted square.');
return `<h2>${LV[G.level]} · ${G.content==='mix'?L('Campuran','Mixed'):MN[G.content]} · ${n}×${n}</h2>${res}<div class="row">${G.names.map((nm,i)=>`<span class="pill ${G.fmt==='two'&&i===p&&!G.over?'on':''}">${i?'★':'✓'} ${esc(nm)}: <b>${G.sc[i]}</b></span>`).join('')}${G.fmt==='quick'?`<span class="pill">⏱ <b id="tm">${Math.max(0,G.left)}</b>s</span>`:''}<span class="pill">${L('Soal','Question')} ${G.asked}/${G.max}</span></div>
${G.over?'':`<div class="row" style="margin:12px 0"><div id="die" class="die" aria-live="polite">${G.d?face(G.d):'🎲'}</div><div><button class="btn pr" ${G.rolled||G.q?'disabled':''} onclick="roll()">🎲 ${L('Lempar Dadu','Roll Dice')}</button><p class="mu">${G.fmt==='two'?esc(G.names[p])+': ':''}${dm}</p></div></div>`}${qp}
<div class="board" style="grid-template-columns:repeat(${n},1fr)" role="group" aria-label="${L('Papan Bingo','Bingo Board')}">${cells}</div>`}
function vProg(){const s=cur.st,ms=Object.entries(s.md),js=cur.jr.filter(j=>jf==='all'||j.l==jf);
return `<h2>${L('Kemajuan & Jurnal','My Progress & Journal')}</h2>${s.g?'':`<p class="mu">${L('Mulai latihan untuk melihat kemajuan.','Start playing to see your progress.')}</p>`}<div class="sts">${card(L('Akurasi','Accuracy'),s.a?Math.round(100*s.c/s.a)+'%':'-')}${card(L('Skor','Score'),s.sc)}${card('Bingo',s.b)}${card(L('Hari belajar','Study days'),s.days.length)}</div>
<div class="card"><h3>${L('Akurasi per materi','Accuracy by content')}</h3>${ms.length?ms.map(([k,m])=>`<p>${MN[k]}: ${m.c}/${m.a} (${Math.round(100*m.c/m.a)}%)</p><div class="bar"><i style="width:${100*m.c/m.a}%"></i></div>`).join(''):`<p class="mu">${L('Belum ada data.','No data yet.')}</p>`}</div>
<div class="card"><h3>${L('Jurnal belajar','Learning journal')}</h3><label for="jf">${L('Filter level','Level filter')}</label><select id="jf" onchange="jf=this.value;render()"><option value="all">${L('Semua','All')}</option>${LV.map((x,i)=>`<option value="${i}" ${jf==i?'selected':''}>${x}</option>`).join('')}</select>
<div class="tw"><table><tr><th>${L('Tanggal','Date')}</th><th>Level</th><th>${L('Materi','Content')}</th><th>${L('Format','Format')}</th><th>${L('Papan','Board')}</th><th>${L('Benar/Soal','Right/Qs')}</th><th>${L('Skor','Score')}</th><th>Bingo</th><th>${L('Durasi','Time')}</th></tr>${js.map(j=>`<tr><td>${esc(j.d)}</td><td>${LV[j.l]}</td><td>${j.c==='mix'?'Mix':MN[j.c]}</td><td>${FM[j.f]}</td><td>${j.n}×${j.n}</td><td>${j.k}/${j.a}</td><td>${j.sc}</td><td>${j.b}</td><td>${j.s}s</td></tr>`).join('')}</table></div></div>`}
function vBadges(){return `<h2>${L('Pencapaian & Badge','Achievements & Badges')}</h2>${BG.map(b=>{const u=b[2](cur.st);return `<div class="card"><b>${u?'🏅':'🔒'} ${b[0]}</b> — ${u?L('Terbuka','Unlocked'):L('Terkunci','Locked')}<br><span class="mu">${L(b[1][0],b[1][1])}</span></div>`}).join('')}`}
function vLb(){const r=Object.values(DB.profiles).sort((a,b)=>b.st.sc-a.st.sc);return `<h2>🏆 Local Leaderboard</h2><p class="mu sm">${L('Data lokal perangkat ini. Hanya nama depan yang ditampilkan.','Local data from this device. Only first names are shown.')}</p>${DB.cfg.lb?`<div class="card tw"><table><tr><th>#</th><th>${L('Nama','Name')}</th><th>${L('Skor','Score')}</th><th>Bingo</th></tr>${r.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name.split(' ')[0])}</td><td>${p.st.sc}</td><td>${p.st.b}</td></tr>`).join('')}</table></div>`:`<p>${L('Leaderboard dinonaktifkan di Pengaturan.','Leaderboard is turned off in Settings.')}</p>`}`}
function printCert(l){document.querySelectorAll('.cert').forEach(c=>c.classList.toggle('pr',c.dataset.l==l));document.body.dataset.pr=1;print();setTimeout(()=>delete document.body.dataset.pr,500)}
function vCert(){const d=Object.entries(cur.done);return `<h2>${L('Sertifikat','Certificates')}</h2>${d.length?d.map(([l,x])=>`<div class="cert" data-l="${l}"><div class="cb"><h3>🎲 DICE BINGO</h3><h2>Certificate of Achievement</h2><p>${L('Diberikan kepada','Awarded to')}</p><h2 style="color:inherit">${esc(cur.name)}</h2><p>${L('Kelas','Class')} ${esc(cur.cls)} · ${esc(cur.school)}</p><p>${L('Level diselesaikan','Level completed')}: <b>${LV[l]}</b><br>${L('Skor','Score')}: ${x.sc} · Bingo: ${x.b}<br>${x.date}</p><p class="sm">Created by Ahmad Budi Leksono</p></div><button class="btn noprint" onclick="printCert(${l})">🖨 ${L('Cetak / Simpan PDF','Print / Save as PDF')}</button></div>`).join(''):`<div class="card"><p>${L('Belum ada sertifikat. Menangkan Bingo pada sebuah level dengan akurasi minimal 60% (bukan Latihan Bebas).','No certificates yet. Win a Bingo at a level with at least 60% accuracy (not Free Practice).')}</p></div>`}`}
function vBank(){const q=($('#vs')||{}).value||'',lf=($('#vl')||{}).value||'all';
return `<h2>${L('Bank Soal & Kosakata','Question & Vocabulary Bank')}</h2><div class="card tw"><p>${L('Jumlah soal aktual','Actual number of questions')}: <b>${Q.length}</b> (${L('target awal 600; bank akan diperluas bertahap','initial target 600; the bank will be expanded gradually')})</p><table><tr><th>Level</th>${Object.values(MN).map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr>${LV.map((n,i)=>`<tr><td>${n}</td>${Object.keys(MN).map(m=>`<td>${Q.filter(x=>x.l===i&&x.m===m).length}</td>`).join('')}<td><b>${Q.filter(x=>x.l===i).length}</b></td></tr>`).join('')}</table></div>
<div class="card"><h3>${L('Kosakata','Vocabulary')}</h3><div class="grid2"><div><label for="vs">${L('Cari','Search')}</label><input id="vs" value="${esc(q)}" oninput="render();$('#vs').focus();$('#vs').setSelectionRange(99,99)"></div><div><label for="vl">Level</label><select id="vl" onchange="render()"><option value="all">${L('Semua','All')}</option>${LV.map((x,i)=>`<option value="${i}" ${lf==i?'selected':''}>${x}</option>`).join('')}</select></div></div>
<div class="tw"><table><tr><th>English</th><th>Indonesia</th><th>Level</th><th></th></tr>${VW.filter(w=>(lf==='all'||w.l==lf)&&(w.en+w.id).toLowerCase().includes(q.toLowerCase())).map(w=>`<tr><td>${w.en}</td><td>${w.id}</td><td>${LV[w.l]}</td><td>${TTS?`<button class="btn" aria-label="${L('Dengarkan','Listen')} ${w.en}" onclick="speak('${w.en}')">🔊</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function vSet(){const c=DB.cfg,ck=(k,t)=>`<label><input type="checkbox" ${c[k]?'checked':''} onchange="DB.cfg.${k}=this.checked;save();render()"> ${t}</label>`;
return `<h2>${L('Pengaturan','Settings')}</h2><div class="card"><label>${L('Bahasa','Language')}</label>${langBtns()}<label for="th">${L('Tema','Theme')}</label><select id="th" onchange="DB.cfg.theme=this.value;save();theme()"><option value="auto" ${c.theme==='auto'?'selected':''}>Auto</option><option value="light" ${c.theme==='light'?'selected':''}>${L('Terang','Light')}</option><option value="dark" ${c.theme==='dark'?'selected':''}>${L('Gelap','Dark')}</option></select>
${ck('snd',L('Efek suara','Sound effects'))}${ck('anim',L('Animasi dadu','Dice animation'))}${ck('hint',L('Tombol petunjuk','Hint button'))}${ck('lb',L('Tampilkan leaderboard','Show leaderboard'))}
<label for="tt">${L('Durasi Tantangan Cepat (detik)','Quick Challenge duration (seconds)')}</label><select id="tt" onchange="DB.cfg.time=+this.value;save()">${[60,90,120,180,300].map(x=>`<option ${c.time===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="card"><h3>${L('Data','Data')}</h3><p class="mu sm">${L('Progres disimpan di peramban perangkat ini saja (tidak ada cloud).','Progress is stored only in this device’s browser (no cloud).')}</p><button class="btn" onclick="if(confirmReset){cur.st={g:0,a:0,c:0,sc:0,b:0,lv:{},md:{},days:[],perfect:false};cur.jr=[];cur.done={};save();confirmReset=false}else confirmReset=true;render()">${confirmReset?L('Yakin? Klik lagi untuk menghapus.','Sure? Click again to delete.'):L('Reset progres profil ini','Reset this profile’s progress')}</button></div>`}
function vHelp(){return `<h2>${L('Bantuan & Petunjuk','Help & Instructions')}</h2><div class="card"><ol><li>${L('Pilih level, materi, format, dan ukuran papan.','Choose a level, content, format and board size.')}</li><li>${L('Tekan Lempar Dadu. Angka dadu menentukan petak yang menyala.','Press Roll Dice. The number decides which squares light up.')}</li><li>${L('Pilih petak, jawab soal, lalu tekan Periksa Jawaban.','Pick a square, answer the question, then press Check Answer.')}</li><li>${L('Jawaban benar menandai petak. Lengkapi satu baris, kolom, atau diagonal untuk Bingo.','A correct answer marks the square. Complete a row, column or diagonal to get Bingo.')}</li><li>${L('Kemenangan hanya diberikan jika garis benar-benar lengkap.','A win is only given when a line is truly complete.')}</li></ol></div>`}
function vAbout(){return `<h2>${L('Tentang Dice Bingo','About Dice Bingo')}</h2><div class="card"><p>${L('Permainan belajar bahasa Inggris yang memadukan dadu, papan Bingo, dan tantangan kosakata, ejaan, grammar, bacaan, serta listening.','An English-learning game that combines dice, a Bingo board, and challenges in vocabulary, spelling, grammar, reading and listening.')}</p><p><b>Created by Ahmad Budi Leksono</b></p><p class="mu sm">${L('Belum tersedia: Classroom Challenge, Teacher Dashboard, dan sinkronisasi online (memerlukan backend). Bank soal saat ini: ','Not yet available: Classroom Challenge, Teacher Dashboard and online sync (these need a backend). Current question bank: ')}${Q.length}.</p></div>`}
